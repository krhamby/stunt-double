name: vite-pnpm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vite-pnpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite-pnpm:
    name: Vite 8 suite installed with pnpm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: npm test -- vite-pnpm
      - name: upload scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-pnpm-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
          retention-days: 7
