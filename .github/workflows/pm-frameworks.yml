name: package managers, frameworks, universal tier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm-frameworks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-managers:
    name: ${{ matrix.suite }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # pnpm / yarn / bun: the Vite fixture + the whole shared catalogue + universal tier with that package
        # manager. package-managers: bare universal-tier residuals under all four. pm-wiring: link mistakes.
        # pm-init: `stunt-double init` on a fresh create-vite template under all four. pm-registry: the real user
        # path through a local Verdaccio (placeholder peer auto-installed by npm/pnpm/Bun, Yarn warns).
        suite: [pnpm, yarn, bun, package-managers, pm-wiring, pm-init, pm-registry]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: pnpm 12 and Yarn 4 (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@12.11.2 --activate
          corepack prepare yarn@4.18.1 --activate
          pnpm --version && yarn --version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: npm test -- ${{ matrix.suite }}
      - name: upload scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
          retention-days: 7

  typescript-and-universal:
    name: TypeScript 7 / 5.9 matrix, unknown-tool universal tier, PnP type gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node --test packages/stunt-double/test/typegate-pnp.test.mjs packages/stunt-double/test/wiring-links.test.mjs
      - run: npm test -- typescript-matrix universal-node
