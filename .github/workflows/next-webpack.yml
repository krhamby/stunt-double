name: next-webpack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: next-webpack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-webpack:
    name: Next.js 16 (--webpack) suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      - run: npm test -- next-webpack
      - name: upload scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-webpack-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
          retention-days: 7
