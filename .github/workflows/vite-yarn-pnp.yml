name: vite-yarn-pnp

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vite-yarn-pnp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vite-yarn-pnp:
    name: Vite 8 suite installed with Yarn 4 PnP suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      - run: corepack enable && npm test -- vite-yarn-pnp
      - name: upload scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-yarn-pnp-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
          retention-days: 7
