name: esbuild

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: esbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esbuild:
    name: esbuild 0.28 suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      - run: npm test -- esbuild
      - name: upload scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esbuild-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
          retention-days: 7
