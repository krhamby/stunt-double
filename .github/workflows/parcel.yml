name: parcel
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parcel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parcel:
    name: Parcel 2.16 suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      # R5 browser check: tests/parcel.test.mjs loads the built bundle in headless Chromium (fails without it in CI)
      - name: Install Playwright + Chromium
        run: npm i -g playwright@1.56.1 && npx -y playwright@1.56.1 install --with-deps chromium
      - run: npm test -- parcel
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcel-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
