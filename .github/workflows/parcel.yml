name: parcel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: parcel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parcel:
    name: Parcel 2 suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      - name: Chromium for the render probe (playwright-core, the fixture's version)
        run: npx -y playwright-core@1.64.0 install --with-deps chromium
      - run: npm test -- parcel
      - name: upload scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parcel-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
          retention-days: 7
