name: webpack family

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: webpack-family-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: [webpack, rspack, rsbuild]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - name: Chromium for the dev-server overlay checks
        run: npm i -g playwright@1.56.1 && playwright install --with-deps chromium
      - run: node --test tests/${{ matrix.tool }}.test.mjs
