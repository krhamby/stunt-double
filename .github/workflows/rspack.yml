name: rspack
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: rspack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rspack:
    name: Rspack 2 suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      - name: Chromium for the dev-server probe (overlay checks in a real browser)
        run: npm i -g playwright@1.56.1 && playwright install --with-deps chromium
      - run: npm test -- rspack
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspack-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
