name: gatsby
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: gatsby-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gatsby:
    name: Gatsby 5 suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      - name: Chromium for the dev-server overlay probe
        run: npm i -g playwright@1.56.1 && playwright install --with-deps chromium
      - run: npm test -- gatsby
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatsby-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
