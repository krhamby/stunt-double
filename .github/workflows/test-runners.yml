# The test-runner group: Jest, Vitest (beyond the reference vite suite), Storybook (builder-vite and
# builder-webpack5) and Metro. One job per suite; each is a defineToolSuite() in tests/<suite>.test.mjs.
name: test-runners
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: test-runners-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    name: ${{ matrix.suite }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [jest, vitest, storybook, metro]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      - name: Chromium for Vitest browser mode
        if: matrix.suite == 'vitest'
        run: npx -y playwright@1.64.0 install --with-deps chromium
      - run: npm test -- ${{ matrix.suite }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
