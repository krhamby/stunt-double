name: rsbuild

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rsbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rsbuild:
    name: Rsbuild 2 suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup     # Node 22 + npm cache + npm ci + npm run setup
      - run: npm test -- rsbuild
      - name: upload scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsbuild-results
          path: /tmp/stunt-double-tests/*/results.json
          if-no-files-found: ignore
          retention-days: 7
