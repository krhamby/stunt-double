# esbuild, Rollup, Rolldown, Farm, Parcel and Bun: build the example projects from the packed tarballs and run
# every mistake of the failure catalogue against them (tests/<tool>.test.mjs).
name: cli-bundlers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-bundlers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [esbuild, rollup, rolldown, farm, parcel, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Bun
        if: matrix.suite == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install Playwright + Chromium (Parcel R5 browser check)
        if: matrix.suite == 'parcel'
        run: npm i -g playwright@1.56.1 && npx -y playwright@1.56.1 install --with-deps chromium
      - run: npm ci
      - run: npm run setup
      - run: node --test tests/${{ matrix.suite }}.test.mjs
